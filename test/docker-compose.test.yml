# E2E stack: the production image (LLM_MOCK=true, no volume => fresh database every run) plus a
# Playwright container, which keeps browser dependencies out of the production image.
#
#   docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
#   docker compose -f test/docker-compose.test.yml down -v
services:
  app:
    build:
      context: ..
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
      OPENROUTER_API_KEY: ""
    expose:
      - "8000"

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /work
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8000
      CI: "true"
    volumes:
      - .:/work
      - playwright-node-modules:/work/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx playwright test --project=unit --project=e2e"

volumes:
  playwright-node-modules:
